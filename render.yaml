# Render Blueprint (docs/BUILD_PLAN.md deployment target).
#
# Postgres + object storage are NOT provisioned here — they live on Supabase
# (Postgres, and Supabase Storage via the S3-compatible StorageAdapter). Only
# Redis is a Render-managed resource; the four apps are Docker web/worker
# services. Supabase-sourced secrets (DATABASE_URL, STORAGE_*) are declared
# `sync: false` — set their real values in the Render dashboard after the
# first deploy, they are not stored in this file or in git.
#
# Cross-service URLs (NEXT_PUBLIC_API_URL, SCHEDULING_ENGINE_URL, WEB_BASE_URL,
# SCHEDULING_CALLBACK_BASE_URL) are hardcoded to each service's default
# <name>.onrender.com address, matching the `name:` fields below. If you
# attach a custom domain, update these to match.

services:
  - type: keyvalue
    name: school-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: school-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: school-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: WEB_BASE_URL
        value: https://school-web.onrender.com
      - key: CORS_ORIGIN
        value: https://school-web.onrender.com
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: SCHEDULING_ENGINE_URL
        value: https://school-scheduling-engine.onrender.com
      - key: SCHEDULING_CALLBACK_BASE_URL
        value: https://school-api.onrender.com
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_ENV
        value: PRODUCTION
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: worker
    name: school-worker
    runtime: docker
    dockerfilePath: infra/docker/worker.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: WORKER_PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: school-redis
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: WEB_BASE_URL
        value: https://school-web.onrender.com
      - key: CORS_ORIGIN
        value: https://school-web.onrender.com
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: SCHEDULING_TIMEOUT_MINUTES
        value: 10
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: school-web
    runtime: docker
    dockerfilePath: infra/docker/web.Dockerfile
    dockerContext: .
    plan: starter
    # Render auto-translates this service's env vars into Docker build args for
    # any matching `ARG` in the Dockerfile — see infra/docker/web.Dockerfile's
    # `ARG NEXT_PUBLIC_API_URL`. No separate build-args field is needed.
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://school-api.onrender.com

  - type: web
    name: school-scheduling-engine
    runtime: docker
    dockerfilePath: infra/docker/scheduling-engine.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGIN
        value: https://school-web.onrender.com
      - key: WEB_BASE_URL
        value: https://school-web.onrender.com
