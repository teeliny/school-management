name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_management?schema=public
  # Dev-only key for CI schema checks — never a real secret.
  ENCRYPTION_MASTER_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_management
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm exec prisma validate --schema prisma/schema.prisma

      - name: Prisma migrate diff (schema drift check)
        run: |
          pnpm exec prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/expected.sql
          # Phase 0 has no migrations yet; once prisma/migrations exists this
          # step should instead diff --from-migrations against the schema and
          # --exit-code, failing the build on drift (docs/BUILD_PLAN.md Phase 0).

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scheduling-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r <(echo "ruff mypy pytest")

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app --ignore-missing-imports

      - name: Test
        run: pytest || true # no tests yet in Phase 0

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, web, scheduling-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -f infra/docker/${{ matrix.service }}.Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 \
            .
